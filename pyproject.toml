[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xiaozui-research"
version = "1.0.0"
description = "小醉桌面研究：受控的单人桌面调研流水线"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Custom Dual-Reserved License" }
authors = [{ name = "keaizuizui" }]
dependencies = [
    "openai>=1.0",
    "requests>=2.31",
    "httpx>=0.27",
    "numpy>=1.26",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "matplotlib>=3.8",
    "rank-bm25>=0.2.2",
    "beautifulsoup4>=4.12",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "cryptography>=42.0",
]

[project.scripts]
xiaozui-research = "cli:main"

[tool.setuptools]
# CLI 依赖仓库内的 调研工具 目录，当前仅支持 pip install -e .
py-modules = ["cli"]
